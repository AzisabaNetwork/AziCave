name: AziCave
version: '${version}'
main: net.azisaba.aziCave.AziCave
description: Roguelike dungeon generator with external schematic templates.
api-version: '1.21'
softdepend:
  - WorldEdit
commands:
  azicave:
    description: Manage AziCave dungeon generation and game sessions.
    usage: /azicave <start|end|session|round|money|stats|generate|reload|debug|author>
    permission: azicave.command
permissions:
  azicave.command:
    description: Allows using the AziCave command.
    default: true
  azicave.start:
    description: Allows creating an AziCave session with the legacy start command.
    default: op
  azicave.end:
    description: Allows ending AziCave sessions.
    default: op
  azicave.session:
    description: Allows creating, joining and leaving AziCave sessions.
    default: true
  azicave.session.forceend:
    description: Allows force-ending any AziCave session.
    default: op
  azicave.session.list:
    description: Allows listing all active AziCave sessions.
    default: op
  azicave.session.spectate:
    description: Allows freely spectating AziCave sessions and teleporting between them in spectator mode.
    default: op
    children:
      minecraft.command.teleport: true
  azicave.money:
    description: Allows viewing and editing AziCave session money.
    default: op
  azicave.stats:
    description: Allows viewing your AziCave player statistics.
    default: true
  azicave.stats.others:
    description: Allows viewing another player's AziCave statistics.
    default: op
  azicave.command.reload:
    description: Allows reloading AziCave configuration.
    default: op
  azicave.command.debug:
    description: Allows toggling AziCave debug logging.
    default: op
  azicave.command.generate:
    description: Allows generating dungeons.
    default: op
  azicave.command.author:
    description: Allows editing templates in-game.
    default: op
  azicave.beta.join:
    description: Allows joining an AziCave beta session.
    default: op
